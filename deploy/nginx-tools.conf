# 운영 서버 /etc/nginx/sites-available/blog 사본 (2026-11-13 동기화). 수정 시 서버와 함께 갱신.
# Cache-Control 은 add_header 한 줄로(expires 와 같이 쓰면 헤더가 중복됨).
server {
    server_name 54.180.32.78 gemini2k.co.kr www.gemini2k.co.kr;
    root /var/www/tools;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 서비스워커: 즉시 갱신되도록 캐시 안 함
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 라이브러리·폰트: 불변 → 장기 캐시
    location ~* ^/(vendor|fonts)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 앱 코드·이미지(css/js/img): 빌드 ?v= 버전 쿼리로 배포마다 무효화
    location ~* \.(css|js|png|jpg|jpeg|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gemini2k.co.kr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gemini2k.co.kr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.gemini2k.co.kr) { return 301 https://\$host\$request_uri; }
    if ($host = gemini2k.co.kr) { return 301 https://\$host\$request_uri; }
    listen 80;
    server_name 54.180.32.78 gemini2k.co.kr www.gemini2k.co.kr;
    return 404;
}
